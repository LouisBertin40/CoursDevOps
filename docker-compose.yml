services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - redis
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  app-blue:
    build: .
    profiles: ["blue"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEPLOY_COLOR=blue
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-net

  app-green:
    build: .
    profiles: ["green"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEPLOY_COLOR=green
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-net

volumes:
  redis-data:

networks:
  app-net: